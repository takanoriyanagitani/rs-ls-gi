[package]
name = "rs-ls-gi"
version = "0.1.0"
edition = "2024"

description = "Simple ls which respects .gitignore"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-ls-gi"
homepage = "https://github.com/takanoriyanagitani/rs-ls-gi"
documentation = "https://docs.rs/rs-ls-gi/latest"
keywords = ["ls", "ltsv", "gitignore", "hidden", "cli"]

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "ls-gi"

[dependencies.ignore]
version = "0.4.33"
default-features = false
features = [
]
